services:
  - type: web
    name: ali-hospital
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /login
    envVars:
      - key: APP_NAME
        value: "Ali's Hospital"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        generateValue: true
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: ali-hospital-db
          property: connectionString

databases:
  - name: ali-hospital-db
    databaseName: ali_hospital
    plan: free
